name: Create Release

on:
  push:
    branches: [staging]

  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release from"
        type: choice
        options: [main, staging]
        default: main

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=main" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0

      - name: Calculate next semver (dry run)
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main,staging
          dry_run: true

      - name: Build final tag name
        id: final
        run: |
          BASE_TAG="${{ steps.tag.outputs.new_tag }}"
          if [ "${{ steps.branch.outputs.name }}" = "staging" ]; then
            echo "tag=${BASE_TAG}-staging" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        run: |
          git tag ${{ steps.final.outputs.tag }}
          git push origin ${{ steps.final.outputs.tag }}

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.final.outputs.tag }}
          target_commitish: ${{ steps.branch.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ steps.branch.outputs.name == 'staging' }}

      - name: Trigger build workflow
        if: steps.tag.outputs.new_tag != steps.tag.outputs.previous_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --ref ${{ steps.branch.outputs.name }} \
            -f release-version=${{ steps.final.outputs.tag }}
