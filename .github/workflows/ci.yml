name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repo carries pre-existing lint debt (including real
      # @typescript-eslint errors, not just formatting) in files a PR may
      # only touch in passing. Gate on each changed file's error COUNT going
      # up relative to the base branch, not on the file being error-free —
      # that catches genuinely new problems without blocking a PR on
      # history it didn't introduce and isn't asked to clean up.
      - name: Lint changed files (no new errors vs. base)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "No TS/TSX files changed — skipping lint."
            exit 0
          fi
          FAILED=0
          for f in $FILES; do
            NEW_COUNT=$(bunx eslint --format json "$f" 2>/dev/null | jq '[.[].messages[] | select(.severity==2)] | length')
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              OLD_COUNT=$(git show "$BASE:$f" | bunx eslint --stdin --stdin-filename "$f" --format json 2>/dev/null | jq '[.[].messages[] | select(.severity==2)] | length')
            else
              OLD_COUNT=0
            fi
            echo "$f: errors $OLD_COUNT -> $NEW_COUNT"
            if [ "$NEW_COUNT" -gt "$OLD_COUNT" ]; then
              echo "::error file=$f::New lint errors introduced ($OLD_COUNT -> $NEW_COUNT)"
              bunx eslint "$f" || true
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
