name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The repo carries pre-existing lint debt in files this PR doesn't
      # touch, so lint only what the PR actually changed — the goal is
      # catching new issues, not blocking every PR on unrelated history.
      - name: Lint changed files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx')
          if [ -z "$FILES" ]; then
            echo "No TS/TSX files changed — skipping lint."
          else
            echo "$FILES"
            echo "$FILES" | xargs bunx eslint
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
