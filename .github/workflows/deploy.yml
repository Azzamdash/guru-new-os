name: Deploy to Server
on:
  workflow_run:
    workflows: ["Build & Push Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Override target IP'
        required: false
        type: string
      release_version:
        description: 'Release version tag to deploy'
        required: false
        type: string

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      version: ${{ steps.gate2.outputs.version }}
    steps:
      - name: Check target configured
        id: gate
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          MANUAL_IP: ${{ inputs.target_ip }}
        run: |
          if [[ -n "$MANUAL_IP" || -n "$SERVER_IP" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SERVER_IP secret configured and no target_ip provided — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine version
        id: ver
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | jq -r .tag_name | sed 's/^v//')
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "version=${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
        id: gate2

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET_IP: ${{ inputs.target_ip || secrets.SERVER_IP }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$TARGET_IP" >> ~/.ssh/known_hosts

      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Sync compose files
        run: |
          ssh "$SSH_USER@$TARGET_IP" "mkdir -p /opt/${{ steps.repo.outputs.repo }}"
          scp docker-compose.yml Caddyfile "$SSH_USER@$TARGET_IP:/opt/${{ steps.repo.outputs.repo }}/"

      - name: Write env and deploy
        run: |
          ssh "$SSH_USER@$TARGET_IP" bash -s -- <<EOF
            set -e
            cat > /opt/${{ steps.repo.outputs.repo }}/.env <<ENV
            GITHUB_REPOSITORY=${{ steps.repo.outputs.repo }}
            VERSION=$VERSION
            DOMAIN=${{ secrets.DOMAIN }}
            SUPABASE_SERVICE_ROLE=${{ secrets.SUPABASE_SERVICE_ROLE }}
            ENV
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/${{ steps.repo.outputs.repo }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
