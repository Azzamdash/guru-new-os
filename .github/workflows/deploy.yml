name: Deploy to Server
on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Override target IP'
        required: false
        type: string
      release_version:
        description: 'Release version tag to deploy'
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      version: ${{ steps.gate2.outputs.version }}
    steps:
      - name: Check target configured
        id: gate
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          MANUAL_IP: ${{ inputs.target_ip }}
        run: |
          if [[ -n "$MANUAL_IP" || -n "$SERVER_IP" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SERVER_IP secret configured and no target_ip provided — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine version
        id: ver
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | jq -r .tag_name | sed 's/^v//')
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "version=${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
        id: gate2

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET_IP: ${{ inputs.target_ip || secrets.SERVER_IP }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$TARGET_IP" >> ~/.ssh/known_hosts

      - name: Resolve repository names
        id: repo
        run: |
          FULL="${{ github.repository }}"
          echo "full=${FULL,,}" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "${FULL,,}" | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"

      - name: Sync compose files
        run: |
          ssh "$SSH_USER@$TARGET_IP" "mkdir -p /opt/${{ steps.repo.outputs.name }}"
          scp docker-compose.yml "$SSH_USER@$TARGET_IP:/opt/${{ steps.repo.outputs.name }}/"

      - name: Write env and deploy
        run: |
          ssh "$SSH_USER@$TARGET_IP" bash -s -- <<EOF
          set -e
          cat > /opt/${{ steps.repo.outputs.name }}/.env <<ENV
          GITHUB_REPOSITORY=${{ steps.repo.outputs.full }}
          VERSION=$VERSION
          SERVICE_NAME=${{ steps.repo.outputs.name }}
          DOMAIN=${{ secrets.DOMAIN }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}
          CRON_TOKEN_SHOPIFY_SYNC=${{ secrets.CRON_TOKEN_SHOPIFY_SYNC }}
          CRON_TOKEN_BOSTA_RECALL=${{ secrets.CRON_TOKEN_BOSTA_RECALL }}
          BOSTA_WEBHOOK_TOKEN=${{ secrets.BOSTA_WEBHOOK_TOKEN }}
          INTEGRATION_ENCRYPTION_KEY=${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          ENV
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd /opt/${{ steps.repo.outputs.name }}
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF
