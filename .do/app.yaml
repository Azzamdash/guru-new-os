spec:
  name: egurus-os
  region: fra
  services:
    - name: web
      github:
        repo: Azzamdash/guru-recall-os-e542460d
        branch: main
        deploy_on_push: true
      instance_size_slug: basic-xxs
      instance_count: 1
      http_port: 3000
      build_command: npm install -g bun && bun install && NITRO_PRESET=node-server bun run build
      run_command: node .output/server/index.mjs
      envs:
        - key: NITRO_PRESET
          scope: BUILD_TIME
          value: node-server
        - key: PORT
          scope: RUN_TIME
          value: "3000"
        - key: VITE_SUPABASE_URL
          scope: BUILD_AND_RUN_TIME
          value: REPLACE_ME
        - key: VITE_SUPABASE_PUBLISHABLE_KEY
          scope: BUILD_AND_RUN_TIME
          value: REPLACE_ME
        - key: VITE_SUPABASE_PROJECT_ID
          scope: BUILD_AND_RUN_TIME
          value: REPLACE_ME
        # Server-side names used by the generated Supabase server helpers.
        # src/start.ts falls back to the VITE_* values, but setting both is safer.
        - key: SUPABASE_URL
          scope: RUN_TIME
          value: REPLACE_ME
        - key: SUPABASE_PUBLISHABLE_KEY
          scope: RUN_TIME
          value: REPLACE_ME
        - key: SUPABASE_SERVICE_ROLE_KEY
          scope: RUN_TIME
          type: SECRET
          value: REPLACE_ME
        - key: BOSTA_RECALL_SECRET
          scope: RUN_TIME
          type: SECRET
          value: REPLACE_ME

