services:
  app:
    image: ghcr.io/azzamdash/guru-new-os:latest
#    image: gurunewos:latest
    container_name: guru-new-os
    restart: always
    env-file:
      - /etc/secrets/egurus-os.env
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - SUPABASE_SERVICE_ROLE_KEY
    networks:
      - app-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-net

volumes:
  caddy_data:
  caddy_config:

networks:
  app-net:
    driver: bridge
